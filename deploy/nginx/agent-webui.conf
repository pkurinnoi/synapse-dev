# nginx site — Claude Dev Team web control panel
#
# Serves the panel over TLS on a dedicated port, proxying to the panel bound on
# localhost. Keep WEBUI_HOST=127.0.0.1 in scripts/.env so the panel itself is
# never reachable except through this block.
#
# Install (replace the domain/ports to taste):
#   sudo cp deploy/nginx/agent-webui.conf /etc/nginx/sites-available/agent-webui.conf
#   sudo ln -sf /etc/nginx/sites-available/agent-webui.conf \
#               /etc/nginx/sites-enabled/agent-webui.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 9090/tcp
#
# Then set WEBUI_TLS=1 in scripts/.env and restart the panel, so the session
# cookie is marked Secure.
#
# The cert is shared with the domain's main vhost — certbot renews it there and
# a reload picks it up here too.

server {
    listen 9090 ssl;
    listen [::]:9090 ssl;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # An admin panel: never index it, never let it be framed.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # The panel caps request bodies at 4 MB (agent files, config files).
    client_max_body_size 4m;

    # A plain http:// request to this TLS port would otherwise get nginx's raw
    # "sent to HTTPS port" error; bounce it to https instead.
    error_page 497 =301 https://$host:$server_port$request_uri;

    access_log /var/log/nginx/agent-webui.access.log;
    error_log  /var/log/nginx/agent-webui.error.log;

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The panel marks its session cookie Secure off this header.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A dry-run of the issue selection or an MR merge shells out to the
        # team scripts and can sit for a couple of minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Log tailing streams straight through rather than being buffered.
        proxy_buffering off;
    }
}
